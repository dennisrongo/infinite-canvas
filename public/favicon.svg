<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#F8FAFC"/>
  
  <!-- Connection lines -->
  <line x1="10" y1="16" x2="22" y2="16" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="10" x2="16" y2="22" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="10" x2="22" y2="22" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Nodes (representing notes on canvas) -->
  <!-- Top node -->
  <circle cx="16" cy="8" r="4" fill="#3B82F6"/>
  <circle cx="16" cy="8" r="4" fill="url(#nodeGradient)"/>
  
  <!-- Bottom node -->
  <circle cx="16" cy="24" r="4" fill="#3B82F6"/>
  <circle cx="16" cy="24" r="4" fill="url(#nodeGradient)"/>
  
  <!-- Left node -->
  <circle cx="8" cy="16" r="3" fill="#1E293B"/>
  
  <!-- Right node -->
  <circle cx="24" cy="16" r="3" fill="#1E293B"/>
  
  <!-- Center node -->
  <circle cx="16" cy="16" r="5" fill="#3B82F6"/>
  <circle cx="16" cy="16" r="5" fill="url(#nodeGradient)"/>
  
  <!-- Gradient definition for subtle depth -->
  <defs>
    <radialGradient id="nodeGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </radialGradient>
  </defs>
</svg>